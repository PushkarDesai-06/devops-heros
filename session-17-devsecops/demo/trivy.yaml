# Trivy configuration (container image scanning + security gate)
# Used by:  trivy image --config trivy.yaml <image>
#
# Policy (classroom threshold, see 07-container-image-scanning/README.md):
#   - only HIGH and CRITICAL vulnerabilities count
#   - only vulnerabilities that already have a fixed version count
#     (unfixed ones cannot be remediated by rebuilding; they are tracked separately)
#   - any remaining finding makes trivy exit with code 1 -> the pipeline stops
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  scanners:
    - vuln
vulnerability:
  ignore-unfixed: true
