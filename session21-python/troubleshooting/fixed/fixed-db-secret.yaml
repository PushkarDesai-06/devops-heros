# Scenario 3 - fix: correct password in the Secret (same value as the
# taskboard-postgres Secret created by the chart). Environment variables are read
# only when a container starts, so restart the Deployment after applying:
#   kubectl apply -f troubleshooting/fixed/fixed-db-secret.yaml
#   kubectl rollout restart deployment/taskboard-db-check -n taskboard
apiVersion: v1
kind: Secret
metadata: {name: taskboard-db-url, namespace: taskboard}
type: Opaque
stringData:
  database-url: postgresql+psycopg://taskboard:taskboard@taskboard-postgres:5432/taskboard
