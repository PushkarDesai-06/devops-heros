# Scenario 3 - bad Secret / database connection.
# The backend reads DATABASE_URL from a Secret, but the password in the Secret is
# wrong. The container runs `alembic upgrade head` before Uvicorn, so the migration
# fails, the container exits with code 1 and the Pod ends up in CrashLoopBackOff.
# Requires the chart to be installed (uses the taskboard-postgres Service).
apiVersion: v1
kind: Secret
metadata: {name: taskboard-db-url, namespace: taskboard}
type: Opaque
stringData:
  database-url: postgresql+psycopg://taskboard:Taskb0ard!@taskboard-postgres:5432/taskboard
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-db-check, namespace: taskboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: taskboard-db-check}}
  template:
    metadata: {labels: {app: taskboard-db-check}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/devops-student/taskboard-backend:9c41e7a3d2b84f15a6e0c7d9b1f3a5e8c2d4f6a1
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: taskboard-db-url, key: database-url}}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, periodSeconds: 10}
