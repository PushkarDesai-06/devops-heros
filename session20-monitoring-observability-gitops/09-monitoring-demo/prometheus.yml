global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alert rules are only evaluated if Prometheus is told where the file is.
# The file is mounted into the container by docker-compose.yml.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
